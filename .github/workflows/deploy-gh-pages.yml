name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install web dependencies only
        run: |
          # Backup original package.json
          cp package.json package.json.backup
          
          # Create minimal package.json for web build (no React Native dependencies)
          cat > package.json << 'EOF'
          {
            "name": "study-sidekick-web",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "build:web": "vite build"
            },
            "dependencies": {
              "react": "^18.2.0",
              "react-dom": "^18.2.0",
              "react-router-dom": "^6.20.0",
              "framer-motion": "^10.16.0",
              "classnames": "^2.3.2",
              "uuid": "^9.0.1"
            },
            "devDependencies": {
              "@types/react": "^18.2.0",
              "@types/react-dom": "^18.2.0",
              "@types/node": "^20.0.0",
              "@types/uuid": "^9.0.1",
              "@vitejs/plugin-react": "^4.2.0",
              "vite": "^5.0.0",
              "typescript": "^5.3.0",
              "tailwindcss": "^3.4.0",
              "postcss": "^8.4.0",
              "autoprefixer": "^10.4.0",
              "@tailwindcss/forms": "^0.5.0"
            }
          }
          EOF
          
          # Remove package-lock.json if it exists (to avoid conflicts)
          rm -f package-lock.json
          
          # Install web dependencies only
          npm install --legacy-peer-deps
          
          # Verify critical packages are installed
          npm list react react-dom vite || echo "Warning: Some packages may be missing"

      - name: Build for production
        run: npm run build:web
        env:
          NODE_ENV: production
          BUILD_TARGET: web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
