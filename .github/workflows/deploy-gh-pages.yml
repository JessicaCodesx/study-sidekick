name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install web dependencies only
        run: |
          # Verify vite.config.ts exists before modifying package.json
          if [ ! -f vite.config.ts ]; then
            echo "Error: vite.config.ts not found in frontend directory!"
            ls -la
            exit 1
          fi
          echo "✓ vite.config.ts found"
          
          # Backup original package.json
          cp package.json package.json.backup
          
          # Create minimal package.json for web build (no React Native dependencies)
          cat > package.json << 'EOF'
          {
            "name": "study-sidekick-web",
            "version": "1.0.0",
            "type": "module",
            "scripts": {
              "build:web": "vite build"
            },
            "dependencies": {
              "react": "^18.2.0",
              "react-dom": "^18.2.0",
              "react-router-dom": "^6.20.0",
              "framer-motion": "^10.16.0",
              "classnames": "^2.3.2",
              "uuid": "^9.0.1",
              "firebase": "^10.7.0",
              "react-quill": "^2.0.0",
              "recharts": "^2.10.0",
              "axios": "^1.6.0"
            },
            "devDependencies": {
              "@types/react": "^18.2.0",
              "@types/react-dom": "^18.2.0",
              "@types/node": "^20.0.0",
              "@types/uuid": "^9.0.1",
              "@vitejs/plugin-react": "^4.2.0",
              "vite": "^5.0.0",
              "typescript": "^5.3.0",
              "tailwindcss": "^3.4.0",
              "postcss": "^8.4.0",
              "autoprefixer": "^10.4.0",
              "@tailwindcss/forms": "^0.5.0"
            }
          }
          EOF
          
          # Remove package-lock.json if it exists (to avoid conflicts)
          rm -f package-lock.json
          
          # Install web dependencies only
          npm install --legacy-peer-deps
          
          # Verify critical packages are installed
          npm list react react-dom vite || echo "Warning: Some packages may be missing"

      - name: Build for production
        run: |
          # Ensure vite.config.ts exists
          if [ ! -f vite.config.ts ]; then
            echo "Error: vite.config.ts not found!"
            exit 1
          fi
          # Verify the config will use correct base path
          echo "Building with NODE_ENV=production, BUILD_TARGET=web"
          echo "Expected base path: /study-sidekick/"
          # Export environment variables explicitly
          export NODE_ENV=production
          export BUILD_TARGET=web
          # Build with explicit production environment
          npm run build:web
          # Verify the built index.html has correct paths
          if [ -f dist/index.html ]; then
            echo "=== Checking built index.html for base path ==="
            echo "First few lines with asset references:"
            grep -E "(href|src)" dist/index.html | head -5 || echo "No href/src found"
            echo "=== End of index.html check ==="
          fi
        env:
          NODE_ENV: production
          BUILD_TARGET: web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
