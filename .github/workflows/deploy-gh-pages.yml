name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-gh-pages.yml'
  workflow_dispatch: # Allows manual triggering

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install web dependencies only
        run: |
          # Install web dependencies directly, avoiding React Native packages
          # Core React
          npm install react@^18.2.0 react-dom@^18.2.0 --legacy-peer-deps --save || exit 1
          
          # Routing and UI
          npm install react-router-dom@^6.20.0 framer-motion@^10.16.0 classnames@^2.3.2 uuid@^9.0.1 --legacy-peer-deps --save || exit 1
          
          # Build tools
          npm install --save-dev vite@^5.0.0 @vitejs/plugin-react@^4.2.0 typescript@^5.3.0 --legacy-peer-deps || exit 1
          
          # Type definitions
          npm install --save-dev @types/react@^18.2.0 @types/react-dom@^18.2.0 @types/node@^20.0.0 @types/uuid@^9.0.1 --legacy-peer-deps || exit 1
          
          # Styling
          npm install --save-dev tailwindcss@^3.4.0 postcss@^8.4.0 autoprefixer@^10.4.0 @tailwindcss/forms@^0.5.0 --legacy-peer-deps || exit 1
          
          # Create stub packages to prevent import errors (they won't be used in web build since isMobile=false)
          mkdir -p node_modules/@react-navigation/{drawer,native,stack}
          for dir in drawer native stack; do
            echo '{"name":"@react-navigation/'$dir'","version":"6.0.0","main":"index.js"}' > node_modules/@react-navigation/$dir/package.json
            echo 'module.exports = {};' > node_modules/@react-navigation/$dir/index.js
          done
          
          # Stub React Native packages
          mkdir -p node_modules/{expo,react-native,@react-native-community}
          echo '{"name":"expo","version":"51.0.0","main":"index.js"}' > node_modules/expo/package.json
          echo 'module.exports = {};' > node_modules/expo/index.js
          echo '{"name":"react-native","version":"0.74.0","main":"index.js"}' > node_modules/react-native/package.json
          echo 'module.exports = {};' > node_modules/react-native/index.js

      - name: Build for production
        run: npm run build:web
        env:
          NODE_ENV: production
          BUILD_TARGET: web

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
